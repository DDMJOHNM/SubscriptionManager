name: Release
on:
  workflow_dispatch:
  # Or trigger automatically after staging succeeds

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: v24.21.0
      - run: npm ci
      - run: npx serverless deploy --stage prod