name: Run Tests
# Trigger this workflow on every push or pull request
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'v24.21.0'  # Match your local Node version
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test