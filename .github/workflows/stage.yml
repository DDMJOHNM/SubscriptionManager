name: Stage
on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: v24.21.0
      - run: npm ci
      - run: npm test
      - run: npx serverless deploy --stage staging
      - run: npm run test:integration