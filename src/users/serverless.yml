# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: duskaotearoa
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: online-store
# "service" is the name of this project. This will also be added to your AWS resource names.
service: Users

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/subscriptionUsers
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

build:
  esbuild:
    sourcemap: true

functions:
  createUser:
    handler: handlers/create.handler
    events:
      - http:
          path: domain/users/create
          method: post
          
resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: subscriptionUsers
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
                
                    
plugins:
  - serverless-step-functions

